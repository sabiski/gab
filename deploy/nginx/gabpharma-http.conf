# Nginx HTTP seul — avant certificat Let's Encrypt
# Utilisé par bootstrap.sh ; remplacé par gabpharma.conf après certbot.

upstream gabpharma_app {
    server 127.0.0.1:8001 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name gabpharma.ga www.gabpharma.ga;

    client_max_body_size 25M;

    access_log /var/log/nginx/gabpharma.access.log;
    error_log  /var/log/nginx/gabpharma.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /var/www/gabpharma/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /var/www/gabpharma/media/;
        expires 7d;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://gabpharma_app;
    }
}
