# Nginx — Gab'Pharma (Ubuntu/Debian)
# Copier vers : /etc/nginx/sites-available/gabpharma
# Puis : sudo ln -sf /etc/nginx/sites-available/gabpharma /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx

upstream gabpharma_app {
    server 127.0.0.1:8001 fail_timeout=0;
}

# Redirection HTTP → HTTPS (activer après certificat Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name gabpharma.ga www.gabpharma.ga;

    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gabpharma.ga www.gabpharma.ga;

    # Certificats Let's Encrypt (certbot)
    ssl_certificate     /etc/letsencrypt/live/gabpharma.ga/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gabpharma.ga/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    access_log /var/log/nginx/gabpharma.access.log;
    error_log  /var/log/nginx/gabpharma.error.log;

    # Fichiers statiques collectés (collectstatic)
    location /static/ {
        alias /var/www/gabpharma/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Médias uploadés (ordonnances, logos…)
    location /media/ {
        alias /var/www/gabpharma/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_pass http://gabpharma_app;
    }
}
