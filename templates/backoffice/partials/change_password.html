<form method="post" class="bg-white rounded-2xl border p-5 grid sm:grid-cols-2 gap-3 text-sm max-w-3xl mt-6">
  {% csrf_token %}
  <input type="hidden" name="action" value="change_password">
  <p class="sm:col-span-2 font-extrabold">Changer mon mot de passe</p>
  <p class="sm:col-span-2 text-xs text-ink-muted -mt-2">Si l’admin vous a envoyé un mot de passe temporaire, remplacez-le ici.</p>
  <div>
    <label class="text-xs font-bold text-ink-muted">Mot de passe actuel</label>
    <input type="password" name="current_password" required autocomplete="current-password" class="mt-1 w-full border rounded-xl px-3 py-2">
  </div>
  <div></div>
  <div>
    <label class="text-xs font-bold text-ink-muted">Nouveau (8 car. min.)</label>
    <input type="password" name="new_password" required minlength="8" autocomplete="new-password" class="mt-1 w-full border rounded-xl px-3 py-2">
  </div>
  <div>
    <label class="text-xs font-bold text-ink-muted">Confirmer</label>
    <input type="password" name="new_password2" required minlength="8" autocomplete="new-password" class="mt-1 w-full border rounded-xl px-3 py-2">
  </div>
  <button class="bg-primary-700 text-white font-bold rounded-xl py-2.5 sm:col-span-2">Mettre à jour le mot de passe</button>
</form>
