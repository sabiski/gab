<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#228545">
  <meta name="description" content="Gab'Pharma — Pharmacie en ligne au Gabon. Médicaments, parapharmacie, livraison à domicile.">
  <title>{% block title %}Gab'Pharma{% endblock %} — Pharmacie en ligne Gabon</title>
  <link rel="manifest" href="{% url 'manifest' %}">
  <link rel="icon" type="image/png" href="/static/icons/favicon.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#228545',
              50: '#F0F9F3',
              100: '#DCF0E3',
              200: '#BBE0C7',
              500: '#228545',
              600: '#1B6B37',
              700: '#015533',
              800: '#014428',
            },
            secondary: {
              DEFAULT: '#8DC63F',
              50: '#F7FBEA',
              100: '#EAF5D0',
              500: '#8DC63F',
              600: '#6FA32E',
            },
            ink: { DEFAULT: '#14291C', muted: '#5B6B63' },
            canvas: '#F5F8F6',
            mint: '#E8F5EC',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'sans-serif'],
          },
          boxShadow: {
            card: '0 1px 3px rgba(1,85,51,.06)',
            lift: '0 10px 28px rgba(1,85,51,.10)',
          },
          maxWidth: { site: '1280px' },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/css/app.css?v=6">
  <link rel="stylesheet" href="/static/css/gabpharma-toast.css?v=1">
  {% block extra_head %}{% endblock %}
</head>
<body class="font-sans bg-white text-ink antialiased min-h-screen flex flex-col overflow-x-hidden">
  {% include "web/partials/topbar.html" %}
  {% include "web/partials/header.html" %}
  {% include "web/partials/nav.html" %}

  <main class="flex-1 bg-canvas">
    {% block content %}{% endblock %}
  </main>

  <div id="gp-toast-root" class="gp-toast-root" aria-live="polite" aria-atomic="true"></div>

  {% include "web/partials/footer.html" %}
  <script src="/static/js/gabpharma-toast.js?v=1"></script>
  <script>
    (function () {
      if (!window.GabPharmaToast) return;
      {% if messages %}
      {% for message in messages %}
      GabPharmaToast.show(
        "{{ message|escapejs }}",
        "{% if 'error' in message.tags %}error{% elif 'warning' in message.tags %}warning{% else %}success{% endif %}"
      );
      {% endfor %}
      {% endif %}
    })();
  </script>
  <script src="/static/js/pwa.js" defer></script>
  <script src="/static/js/password-toggle.js?v=1" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
