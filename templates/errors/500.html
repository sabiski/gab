<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erreur serveur — Gab'Pharma</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center px-4 bg-[#F5F8F6]" style="font-family:'Plus Jakarta Sans',sans-serif">
  <div class="text-center max-w-md">
    <img src="/static/images/logo-gabpharma.png" alt="Gab'Pharma" class="h-16 mx-auto mb-6">
    <p class="text-6xl font-extrabold text-red-500/20 mb-2">500</p>
    <h1 class="text-2xl font-extrabold text-[#14291C] mb-2 tracking-tight">Erreur serveur</h1>
    <p class="text-sm text-[#5B6B63] mb-6 font-medium leading-relaxed">
      Un problème technique est survenu. Notre équipe a été informée. Réessayez dans quelques instants.
    </p>
    <div class="flex flex-wrap justify-center gap-3">
      <a href="/" class="inline-flex items-center gap-2 bg-[#228545] hover:bg-[#015533] text-white text-sm font-bold px-5 py-2.5 rounded-full transition">
        <span class="material-symbols-rounded text-base">refresh</span>
        Réessayer
      </a>
      <a href="mailto:support@gabpharma.ga" class="inline-flex items-center gap-2 border-2 border-[#228545] text-[#228545] text-sm font-bold px-5 py-2.5 rounded-full transition hover:bg-[#E8F5EC]">
        <span class="material-symbols-rounded text-base">support_agent</span>
        Support
      </a>
    </div>
  </div>
</body>
</html>
