{% with km=distance|add:1 %}
<a href="{% url 'pharmacy_detail' pharmacy.slug %}" class="flex items-center gap-3 bg-white rounded-2xl p-3 shadow-card hover:shadow-soft transition">
  <div class="h-12 w-12 rounded-xl flex items-center justify-center shrink-0
    {% if pharmacy.logo_color == 'blue' %}bg-sky-100 text-sky-600
    {% elif pharmacy.logo_color == 'purple' %}bg-primary-100 text-primary
    {% else %}bg-secondary-100 text-secondary{% endif %}">
    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M11 2h2v7h7v2h-7v7h-2v-7H4V9h7V2z"/></svg>
  </div>
  <div class="flex-1 min-w-0">
    <h3 class="text-sm font-semibold text-ink truncate">{{ pharmacy.name }}</h3>
    <div class="flex items-center gap-2 text-[11px] text-ink-muted mt-0.5">
      <span class="inline-flex items-center gap-0.5 text-amber-500">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
        {{ pharmacy.rating }}
      </span>
      <span>({{ pharmacy.review_count }})</span>
      <span>•</span>
      <span>À {{ km }}.{{ distance }} km</span>
    </div>
    <p class="text-[11px] text-secondary mt-0.5">{{ pharmacy.status_label }}</p>
  </div>
  <div class="flex items-center gap-1 shrink-0">
    <span class="p-2 rounded-full text-ink-muted hover:bg-slate-50" onclick="event.preventDefault(); window.location.href='tel:{{ pharmacy.phone }}';" role="button" aria-label="Appeler">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
    </span>
    <svg class="w-4 h-4 text-ink-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
  </div>
</a>
{% endwith %}
