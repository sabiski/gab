{% extends "base.html" %}
{% block title %}Mot de passe mis à jour{% endblock %}
{% block content %}
<div class="max-w-site mx-auto px-4 py-12">
  <div class="max-w-md mx-auto bg-white border border-slate-100 rounded-3xl p-8 shadow-card text-center">
    <img src="/static/images/logo-gabpharma.png" alt="Gab'Pharma" class="h-14 mx-auto mb-3">
    <div class="h-16 w-16 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-4">
      <span class="material-symbols-rounded text-4xl">check_circle</span>
    </div>
    <h1 class="text-2xl font-extrabold text-ink tracking-tight">Mot de passe mis à jour</h1>
    <p class="text-sm text-ink-muted font-medium mt-2 leading-relaxed">
      Votre nouveau mot de passe est actif. Vous pouvez vous connecter à votre espace Gab'Pharma.
    </p>
    <a href="{% url 'login' %}" class="mt-6 inline-flex w-full items-center justify-center bg-primary hover:bg-primary-600 text-white font-bold text-sm py-3 rounded-full transition">
      Se connecter
    </a>
  </div>
</div>
{% endblock %}
